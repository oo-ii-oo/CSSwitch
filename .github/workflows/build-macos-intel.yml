name: Build Intel macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build and verify Intel DMG
        shell: bash
        run: bash scripts/build-macos-intel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CSSwitch-macos-intel
          path: dist/intel/
          if-no-files-found: error
          retention-days: 14
